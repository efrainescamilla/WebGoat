name: Sonatype IQ Scan and Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -f pom.xml package

      - name: Sonatype IQ Policy Evaluation
        uses: sonatype/iq-action@v1.0.0
        with:
          iqApplicationId: ${{ secrets.IQ_APPLICATION_ID }}
          iqServerUrl: ${{ secrets.IQ_SERVER_URL }}
          iqUsername: ${{ secrets.IQ_USER }}
          iqPassword: ${{ secrets.IQ_PASSWORD }}
          iqStage: "build"
          scanTargets: "."
          failOnPolicyViolation: true
        
      - name: Upload Policy Evaluation Report
        uses: actions/upload-artifact@v4
        with:
          name: WebGoat-Legacy-policy-eval-report
          path: WebGoat-Legacy-policy-eval-report.html
