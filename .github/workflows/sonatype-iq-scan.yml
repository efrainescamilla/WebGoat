name: WebGoat Build and Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  MAVEN_OPTS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1"
  IQ_CLI_VERSION: "1.158.0-01"  # Versión específica del CLI

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: |
          mvn -B clean package -DskipTests

      - name: Download Sonatype IQ CLI
        id: download-iq-cli
        run: |
          mkdir -p sonatype-iq-cli
          echo "Downloading IQ CLI v${IQ_CLI_VERSION}"
          curl -f -L "https://download.sonatype.com/clm/scanner/nexus-iq-cli-${IQ_CLI_VERSION}.jar" \
            -o sonatype-iq-cli/nexus-iq-cli.jar
          
          # Verificar integridad del JAR
          if [ ! -f "sonatype-iq-cli/nexus-iq-cli.jar" ]; then
            echo "::error::Failed to download IQ CLI"
            exit 1
          fi
          
          jar -tf sonatype-iq-cli/nexus-iq-cli.jar >/dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "::error::Downloaded JAR file is corrupt"
            exit 1
          fi
          
          echo "IQ CLI downloaded and verified successfully"

      - name: Run Sonatype IQ Scan
        run: |
          echo "Running Sonatype IQ Scan..."
          java -jar sonatype-iq-cli/nexus-iq-cli.jar \
            -s "${{ secrets.IQ_SERVER_URL }}" \
            -a "${{ secrets.IQ_APPLICATION_ID }}" \
            -t "build" \
            -u "${{ secrets.IQ_USERNAME }}" \
            -p "${{ secrets.IQ_PASSWORD }}" \
            -r "iq-report.json" \
            target/WebGoat-6.0.2.war || echo "::warning::IQ Scan completed with warnings"
          
          # Generar reporte HTML si el JSON existe
          if [ -f "iq-report.json" ]; then
            pip install jinja2 --quiet
            curl -s -L https://raw.githubusercontent.com/sonatype-nexus-community/nexus-iq-cli-templates/master/jinja2/iq_report.html.j2 \
              -o sonatype-iq-cli/iq_report.html.j2
            python -c "import json, jinja2; \
              t = jinja2.Template(open('sonatype-iq-cli/iq_report.html.j2').read()); \
              open('WebGoat-Legacy-policy-eval-report.html', 'w').write(t.render(json.load(open('iq-report.json'))))"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WebGoat-Artifacts
          path: |
            target/WebGoat-6.0.2.war
            iq-report.json
            WebGoat-Legacy-policy-eval-report.html
