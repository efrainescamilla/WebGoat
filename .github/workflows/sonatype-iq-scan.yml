name: WebGoat Build and Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  MAVEN_OPTS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1"
  IQ_CLI_VERSION: "1.167.0-01"  # Latest stable version

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: |
          mvn -B clean package -DskipTests \
            -Dmaven.compiler.showWarnings=true \
            -Dmaven.compiler.showDeprecation=true
          
          # Verify WAR file was created
          if [ ! -f "target/WebGoat-6.0.2.war" ]; then
            echo "::error::Build failed - WAR file not found"
            exit 1
          fi

      - name: Download Sonatype IQ CLI
        id: download-cli
        run: |
          mkdir -p sonatype-iq-cli
          echo "Downloading IQ CLI v$IQ_CLI_VERSION"
          curl -f -L "https://download.sonatype.com/clm/scanner/nexus-iq-cli-$IQ_CLI_VERSION.jar" \
            -o sonatype-iq-cli/nexus-iq-cli.jar || exit 1
          
          # Verify JAR integrity
          if ! jar -tf sonatype-iq-cli/nexus-iq-cli.jar >/dev/null; then
            echo "::error::Downloaded JAR file is corrupt"
            exit 1
          fi

      - name: Run Sonatype IQ Scan
        run: |
          echo "Running security scan..."
          java -jar sonatype-iq-cli/nexus-iq-cli.jar \
            -s "${{ secrets.IQ_SERVER_URL }}" \
            -a "${{ secrets.IQ_USERNAME }}:${{ secrets.IQ_PASSWORD }}" \
            -i "${{ secrets.IQ_APPLICATION_ID }}" \
            -t "build" \
            -r "iq-result.json" \
            target/WebGoat-6.0.2.war || echo "::warning::Scan completed with warnings"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            target/WebGoat-6.0.2.war
            iq-result.json
