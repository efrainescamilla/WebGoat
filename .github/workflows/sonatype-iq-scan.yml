name: WebGoat Build and Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'
    
    - name: Build with Maven
      run: |
        # Configuración adicional para compatibilidad
        export MAVEN_OPTS="-XX:+TieredCompilation -XX:TieredStopAtLevel=1"
        mvn -B -DskipTests clean package
        
    - name: Sonatype IQ Scan
      uses: sonatype/actions/scan@v1
      with:
        iq-server-url: ${{ secrets.IQ_SERVER_URL }}
        iq-username: ${{ secrets.IQ_USERNAME }}
        iq-password: ${{ secrets.IQ_PASSWORD }}
        iq-application-id: ${{ secrets.IQ_APPLICATION_ID }}
        iq-stage: build
        scan-target: target/WebGoat-6.0.2.war
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WebGoat-6.0.2
        path: target/WebGoat-6.0.2.war
