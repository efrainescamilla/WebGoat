name: WebGoat Build and Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  MAVEN_OPTS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1"
  IQ_CLI_VERSION: "1.167.0-01"
  IQ_STAGE: "build"

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
          check-latest: true

      - name: Build with Maven
        id: build
        run: |
          mvn -B clean package -DskipTests \
            -Dmaven.compiler.showWarnings=true \
            -Dmaven.compiler.showDeprecation=true \
            -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
          
          if [ ! -f "target/WebGoat-6.0.2.war" ]; then
            echo "::error::Build failed - WAR file not found"
            exit 1
          fi
          echo "war_file=target/WebGoat-6.0.2.war" >> $GITHUB_OUTPUT

      - name: Download Sonatype IQ CLI
        id: download-cli
        run: |
          mkdir -p sonatype-iq-cli
          echo "Downloading IQ CLI v$IQ_CLI_VERSION"
          
          for i in {1..3}; do
            if curl -f -L "https://download.sonatype.com/clm/scanner/nexus-iq-cli-$IQ_CLI_VERSION.jar" \
              -o sonatype-iq-cli/nexus-iq-cli.jar && \
              jar -tf sonatype-iq-cli/nexus-iq-cli.jar >/dev/null; then
              break
            elif [ $i -eq 3 ]; then
              echo "::error::Failed to download or verify IQ CLI after 3 attempts"
              exit 1
            fi
            sleep 5
          done
          
          echo "cli_path=sonatype-iq-cli/nexus-iq-cli.jar" >> $GITHUB_OUTPUT

      - name: Verify IQ Server Connection
        id: verify-iq
        run: |
          echo "Verifying IQ Server connection..."
          response_code=$(curl -s -o /dev/null -w "%{http_code}" \
            -u "${{ secrets.IQ_USERNAME }}:${{ secrets.IQ_PASSWORD }}" \
            "${{ secrets.IQ_SERVER_URL }}/api/v2/applications/${{ secrets.IQ_APPLICATION_ID }}")
          
          if [ "$response_code" -eq 200 ]; then
            echo "::notice::Successfully connected to IQ Server"
            echo "connection_valid=true" >> $GITHUB_OUTPUT
          else
            echo "::error::Failed to connect to IQ Server (HTTP $response_code)"
            echo "connection_valid=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Run Sonatype IQ Scan
        if: steps.verify-iq.outputs.connection_valid == 'true'
        id: iq-scan
        run: |
          echo "Running Sonatype IQ Scan..."
          java -jar "${{ steps.download-cli.outputs.cli_path }}" \
            -s "${{ secrets.IQ_SERVER_URL }}" \
            -a "${{ secrets.IQ_USERNAME }}:${{ secrets.IQ_PASSWORD }}" \
            -i "${{ secrets.IQ_APPLICATION_ID }}" \
            -t "$IQ_STAGE" \
            -r "iq-result.json" \
            "${{ steps.build.outputs.war_file }}"
          
          if [ -f "iq-result.json" ]; then
            echo "::notice::Scan completed successfully"
            violations=$(jq -r '.policyViolations // [] | length' iq-result.json)
            echo "Found $violations policy violations"
            echo "scan_status=success" >> $GITHUB_OUTPUT
          else
            echo "::error::Scan failed to produce results"
            echo "scan_status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Generate HTML Report
        if: steps.iq-scan.outputs.scan_status == 'success'
        run: |
          pip install --quiet jinja2
          curl -s -L https://raw.githubusercontent.com/sonatype-nexus-community/nexus-iq-cli-templates/master/jinja2/iq_report.html.j2 \
            -o iq_report.html.j2
          python -c "
import json, jinja2
template = jinja2.Template(open('iq_report.html.j2').read())
with open('iq-report.html', 'w') as f:
    f.write(template.render(json.load(open('iq-result.json'))))
"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webgoat-artifacts
          path: |
            ${{ steps.build.outputs.war_file }}
            iq-result.json
            iq-report.html
          retention-days: 7

      - name: Fail on Critical Violations
        if: steps.iq-scan.outputs.scan_status == 'success'
        run: |
          critical_violations=$(jq -r '[.policyViolations[] | select(.policyThreatLevel == 8)] | length' iq-result.json)
          if [ "$critical_violations" -gt 0 ]; then
            echo "::error::Found $critical_violations critical policy violations"
            exit 1
          fi
