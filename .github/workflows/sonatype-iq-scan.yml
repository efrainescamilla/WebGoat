name: WebGoat Build and Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  MAVEN_OPTS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1"
  IQ_CLI_VERSION: "1.158.0-01"

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: |
          mvn -B clean package -DskipTests

      - name: Download and verify Sonatype IQ CLI
        run: |
          mkdir -p sonatype-iq-cli
          echo "Downloading IQ CLI v${IQ_CLI_VERSION}"
          curl -f -L "https://download.sonatype.com/clm/scanner/nexus-iq-cli-${IQ_CLI_VERSION}.jar" \
            -o sonatype-iq-cli/nexus-iq-cli.jar
          jar -tf sonatype-iq-cli/nexus-iq-cli.jar >/dev/null || exit 1

      - name: Validate IQ Server connection
        id: validate-iq
        run: |
          echo "Testing connection to IQ Server..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.IQ_SERVER_URL }}/api/v2/applications" \
            -u "${{ secrets.IQ_USERNAME }}:${{ secrets.IQ_PASSWORD }}")
          
          if [ "$RESPONSE" -eq 200 ]; then
            echo "Connection successful (HTTP $RESPONSE)"
            echo "connection-valid=true" >> $GITHUB_OUTPUT
          else
            echo "::error::Connection failed (HTTP $RESPONSE)"
            echo "connection-valid=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Run Sonatype IQ Scan
        if: steps.validate-iq.outputs.connection-valid == 'true'
        run: |
          echo "Running scan with application ID: ${{ secrets.IQ_APPLICATION_ID }}"
          
          # Opción 1: Usando parámetros individuales
          java -jar sonatype-iq-cli/nexus-iq-cli.jar \
            --application-id "${{ secrets.IQ_APPLICATION_ID }}" \
            --server-url "${{ secrets.IQ_SERVER_URL }}" \
            --username "${{ secrets.IQ_USERNAME }}" \
            --password "${{ secrets.IQ_PASSWORD }}" \
            --stage "build" \
            --result-file "iq-report.json" \
            target/WebGoat-6.0.2.war || \
            (echo "::warning::Scan completed with warnings" && exit 0)
          
          # Opción alternativa 2: Usando autenticación combinada
          # AUTH="${{ secrets.IQ_USERNAME }}:${{ secrets.IQ_PASSWORD }}"
          # java -jar sonatype-iq-cli/nexus-iq-cli.jar \
          #   -i "${{ secrets.IQ_APPLICATION_ID }}" \
          #   -s "${{ secrets.IQ_SERVER_URL }}" \
          #   -a "$AUTH" \
          #   -t "build" \
          #   -r "iq-report.json" \
          #   target/WebGoat-6.0.2.war

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WebGoat-Scan-Results
          path: |
            target/WebGoat-6.0.2.war
            iq-report.json
